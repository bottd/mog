[package]
name = "mog-parser"
version = "0.1.0"
edition = "2024"
description = "Parser for Mog markup"
license = "MIT"
authors = ["Drake Bott"]

[dependencies]
kdl = { version = "6", features = ["span"] }
serde = { version = "1.0", features = ["derive"] }
serde-value = "0.7.0"
strum = { version = "0.27", features = ["derive"] }

[dev-dependencies]
insta = { version = "1.47", features = ["yaml"] }
