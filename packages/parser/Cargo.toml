[package]
name = "mog-parser"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
description = "Parser for Mog markup"
license = "MIT"
authors = ["Drake Bott"]

[dependencies]
kdl = "6.7"
serde = { version = "1.0", features = ["derive"] }
winnow = "0.7"

[dev-dependencies]
insta = { version = "1.47", features = ["yaml", "glob"] }
